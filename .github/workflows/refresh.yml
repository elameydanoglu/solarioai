name: Forecast data refresh
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; picks up new measurements as soon as they appear
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest Istanbul observations
        run: |
          END=$(TZ=Europe/Istanbul date +%F)
          START=$(TZ=Europe/Istanbul date -d "$END -10 days" +%F)
          curl -sS --retry 3 -m 60 -o recent.json "https://archive-api.open-meteo.com/v1/archive?latitude=41.01&longitude=28.98&start_date=$START&end_date=$END&daily=temperature_2m_mean,relative_humidity_2m_mean,precipitation_sum,cloud_cover_mean,shortwave_radiation_sum&timezone=Europe%2FIstanbul"
          if grep -q '"error"' recent.json; then cat recent.json; exit 1; fi
      - name: Update the model's latest data
        run: python3 scripts/refresh.py index.html recent.json
      - name: Commit if changed
        run: |
          rm -f recent.json
          if git diff --quiet; then echo "No new data"; exit 0; fi
          git config user.name "solarioai-bot"
          git config user.email "solarioai-bot@users.noreply.github.com"
          git commit -am "Daily data refresh $(TZ=Europe/Istanbul date +%F)"
          git push
